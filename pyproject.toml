[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencad"
version = "0.1.0"
description = "Cross-platform parametric CAD application built on OCCT"
readme = "README.md"
requires-python = ">=3.15.2,<3.16"
license = "GPL-3.0-only"
dependencies = ["nanocct==8.0.1.5", "PySide6==6.12.0", "numpy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
opencad = "opencad.main:main"

[tool.setuptools.packages.find]
include = ["opencad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
